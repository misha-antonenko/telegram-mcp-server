[project]
name = "telegram-mcp-server"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=3.3.1",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0.3",
    "telegramify-markdown>=1.1.2",
    "telethon>=1.43.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
telegram-mcp-server = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
extend-select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "C901",
    "F",
    "FBT",
    "FURB",
    "G",
    "I",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PLE",
    "RUF",
    "SLF",
    "TC",
    "UP",
]
extend-ignore = ["E741", "RUF018", "G004", "PERF203"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "telegram_mcp_server.models.base.ToolModel",
]
runtime-evaluated-decorators = ["fastmcp.FastMCP.tool"]
